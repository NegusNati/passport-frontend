server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Relative redirects so directory-index redirects (e.g. /articles ->
    # /articles/) keep the client's scheme behind the TLS-terminating proxy
    # instead of downgrading to http://.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache busting for hashed static assets (`dist/assets/*`, responsive media, fonts)
    location ~* ^/(assets|media)/.+\.(?:js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Service worker should always revalidate
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # No cache for HTML (always fetch latest shell)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Client-side app routes (and dynamic subtrees) serve the SPA shell.
    # Keep in sync with the router's public/client routes.
    location ~* ^/(login|register|profile|test|calendar|passports|locations|articles|advertisment|advertisement-requests|admin)(/|$) {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Everything else serves only real files (prerendered pages, public assets);
    # unknown URLs get a true 404 instead of a soft-404 app shell.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Unknown URLs return status 404 while still loading the app shell,
    # so the client can render its NotFound view.
    error_page 404 /index.html;

    # Health check endpoint (for Docker)
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
